<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap");

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        font-family: Inter, system-ui, sans-serif;
        background: #f7f7f7;
        color: #1a1a1a;
      }

      .stage {
        position: relative;
        width: 1080px;
        height: 1080px;
        background:
          radial-gradient(ellipse 80% 60% at 50% 40%, #ffffff 0%, #f4f4f4 70%, #efefef 100%);
        overflow: hidden;
      }

      .brand {
        position: absolute;
        top: 52px;
        left: 56px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand img {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #111;
      }

      .brand span {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: #222;
      }

      .badge {
        position: absolute;
        top: 108px;
        left: 56px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 14px;
        border-radius: 999px;
        background: #1a9f6c;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
      }

      .badge svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }

      .headline {
        position: absolute;
        top: 52px;
        left: 300px;
        right: 56px;
      }

      .headline h1 {
        font-size: 54px;
        line-height: 1.05;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #222;
      }

      .headline h1 em {
        font-style: normal;
        color: #1a9f6c;
      }

      .headline p {
        margin-top: 12px;
        font-size: 18px;
        color: #777;
        font-weight: 500;
      }

      .window {
        position: absolute;
        top: 220px;
        left: 50%;
        transform: translateX(-50%);
        width: 520px;
        border-radius: 16px;
        overflow: hidden;
        background: #111;
        border: 1px solid #d8d8d8;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.14);
        z-index: 2;
      }

      .chrome {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 34px;
        padding: 0 12px;
        background: #1a1a1a;
        border-bottom: 1px solid #2a2a2a;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }
      .dot.r { background: #ff5f57; }
      .dot.y { background: #febc2e; }
      .dot.g { background: #28c840; }

      .url {
        margin-left: 8px;
        flex: 1;
        height: 20px;
        border-radius: 5px;
        background: #0f0f0f;
        color: #777;
        font-size: 11px;
        display: flex;
        align-items: center;
        padding: 0 8px;
        font-family: ui-monospace, monospace;
      }

      .window img {
        display: block;
        width: 100%;
        height: 480px;
        object-fit: cover;
        object-position: top left;
      }

      .card {
        position: absolute;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 12px;
        width: 220px;
        padding: 14px 16px;
        border-radius: 14px;
        background: #fff;
        border: 1px solid #ececec;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      }

      .card-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: #eef8f3;
        color: #1a9f6c;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }

      .card-icon svg {
        width: 18px;
        height: 18px;
      }

      .card strong {
        display: block;
        font-size: 15px;
        font-weight: 700;
        color: #222;
      }

      .card span {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        color: #888;
        font-weight: 500;
      }

      .c1 { top: 280px; left: 48px; }
      .c2 { top: 280px; right: 48px; }
      .c3 { top: 520px; left: 48px; }
      .c4 { top: 520px; right: 48px; }

      .line {
        position: absolute;
        z-index: 1;
        border-top: 1.5px dashed #8fd4b4;
        pointer-events: none;
      }

      .l1 {
        top: 310px;
        left: 268px;
        width: 100px;
      }

      .l2 {
        top: 310px;
        right: 268px;
        width: 100px;
      }

      .l3 {
        top: 550px;
        left: 268px;
        width: 100px;
      }

      .l4 {
        top: 550px;
        right: 268px;
        width: 100px;
      }

      .footer {
        position: absolute;
        left: 50%;
        bottom: 48px;
        transform: translateX(-50%);
        display: inline-flex;
        align-items: center;
        gap: 12px;
        height: 52px;
        padding: 0 28px 0 16px;
        border-radius: 999px;
        background: #1a9f6c;
        color: #fff;
        font-size: 17px;
        font-weight: 700;
        white-space: nowrap;
        box-shadow: 0 10px 24px rgba(26, 159, 108, 0.28);
      }

      .check {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #fff;
        color: #1a9f6c;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }

      .check svg {
        width: 16px;
        height: 16px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="brand">
        <img src="../../panel/assets/logo.png" alt="" />
        <span>GARBONA</span>
      </div>

      <div class="badge">
        <svg viewBox="0 0 24 24"><path d="M3 10v4h2l5 4V6L5 10H3zm12.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zm-2.5-7.5v2.1a6.5 6.5 0 0 1 0 10.8v2.1a8.5 8.5 0 0 0 0-15z"/></svg>
        НОВЫЙ РЕЛИЗ
      </div>

      <div class="headline">
        <h1>ВЕБ-ПАНЕЛЬ<br /><em>ЗАПУЩЕНА</em></h1>
        <p>Статистика, сайты и кошелёк — в одном окне</p>
      </div>

      <div class="line l1"></div>
      <div class="line l2"></div>
      <div class="line l3"></div>
      <div class="line l4"></div>

      <div class="card c1">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 19h16" stroke-linecap="round"/>
            <path d="M7 16V11M12 16V7M17 16v-4" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <strong>Дашборд</strong>
          <span>сводка за день</span>
        </div>
      </div>

      <div class="card c2">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4.5 19.5h15" stroke-linecap="round"/>
            <path d="M7 16.5V11M12 16.5V7.5M17 16.5v-3.2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <strong>Аналитика</strong>
          <span>графики и метрики</span>
        </div>
      </div>

      <div class="card c3">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3.5" y="5" width="17" height="14" rx="2"/>
            <path d="M3.5 9h17"/>
          </svg>
        </div>
        <div>
          <strong>Сайты и ссылки</strong>
          <span>в панели</span>
        </div>
      </div>

      <div class="card c4">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 8.2h14.5A1.5 1.5 0 0 1 20 9.7v8.1A1.5 1.5 0 0 1 18.5 19.3H5.5A1.5 1.5 0 0 1 4 17.8V8.2Z"/>
            <path d="M4 8.2V6.8A1.5 1.5 0 0 1 5.5 5.3h10.2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <strong>Кошелёк</strong>
          <span>баланс и выплаты</span>
        </div>
      </div>

      <div class="window">
        <div class="chrome">
          <span class="dot r"></span>
          <span class="dot y"></span>
          <span class="dot g"></span>
          <div class="url">panel.garbona.com/app</div>
        </div>
        <img src="./dashboard-crop.png" alt="" />
      </div>

      <div class="footer">
        <div class="check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
            <path d="M5 12.5 9.5 17 19 7.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        Одна панель. Полный контроль над работой
      </div>
    </div>
  </body>
</html>
