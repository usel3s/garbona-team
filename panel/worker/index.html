<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#090909" />
    <title>Главная - Garbona</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/worker.css" />
    <link rel="icon" href="../assets/logo.png" type="image/png" />
  </head>
  <body>
    <div class="app">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-sheet-handle" aria-hidden="true"></div>
        <div class="sidebar-top">
          <div class="sidebar-brand-row">
            <div class="sidebar-logo"><img src="../assets/logo.png" alt="" /></div>
            <span class="sidebar-brand">Garbona</span>
            <button type="button" class="sidebar-close" id="sidebarClose" aria-label="Close">✕</button>
          </div>
          <nav class="nav" id="nav">
            <button type="button" class="nav-item is-active" data-view="dashboard">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H5.5A1.5 1.5 0 0 1 4 19V10.5Z" stroke="currentColor" stroke-width="1.5"/><path d="M9.5 20.5V14h5v6.5" stroke="currentColor" stroke-width="1.5"/></svg>
              <span data-i18n="nav.dashboard">Главная</span>
            </button>
            <button type="button" class="nav-item is-disabled" disabled>
              <svg viewBox="0 0 24 24" fill="none"><path d="M7 3.5h7l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-9.5A1.5 1.5 0 0 1 5.5 20V5A1.5 1.5 0 0 1 7 3.5Z" stroke="currentColor" stroke-width="1.5"/></svg>
              <span data-i18n="nav.logs">Логи</span>
            </button>
            <button type="button" class="nav-item" data-view="sites">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5"/></svg>
              <span data-i18n="nav.sites">Сайты</span>
            </button>
            <button type="button" class="nav-item is-disabled" disabled>
              <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="4" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/></svg>
              <span data-i18n="nav.tasks">Задачи</span>
            </button>
            <button type="button" class="nav-item" data-view="team">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8.5" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M3.8 18.5c.7-3 2.7-4.6 5.2-4.6s4.5 1.6 5.2 4.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <span data-i18n="nav.team">Команда</span>
            </button>
            <button type="button" class="nav-item" data-view="wallet">
              <svg viewBox="0 0 24 24" fill="none"><path d="M6 8h12v10H6V8Z" stroke="currentColor" stroke-width="1.5"/><path d="M9 8V6.5A1.5 1.5 0 0 1 10.5 5h3A1.5 1.5 0 0 1 15 6.5V8" stroke="currentColor" stroke-width="1.5"/></svg>
              <span data-i18n="nav.wallet">Кошелёк</span>
            </button>
            <button type="button" class="nav-item" data-view="settings">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <span data-i18n="nav.settings">Настройки</span>
            </button>
          </nav>
        </div>
        <div class="sidebar-bottom">
          <div class="sidebar-foot">
            <button type="button" class="sidebar-foot-item" id="sidebarSettings">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <span data-i18n="nav.settings">Настройки</span>
            </button>
            <a href="#" class="sidebar-foot-item" id="sidebarGettingStarted" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 16.5c3.5-7 11.5-7 15 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M12 15.5V6.5l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 6.5h7v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span data-i18n="nav.gettingStarted">С чего начать?</span>
            </a>
            <a href="#" class="sidebar-foot-item" id="sidebarUpdates" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l1.2 3.6L17 8l-3.6 1.2L12 13l-1.2-3.8L7 8l3.8-1.4L12 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M5 16l.8 2.4L8 19l-2.2.8L5 22l-.8-2.2L2 19l2.2-.6L5 16Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M19 14l.6 1.8L21.5 17l-1.9.7L19 19.5l-.6-1.8L16.5 17l1.9-.7L19 14Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
              <span data-i18n="nav.updates">Обновления</span>
            </a>
            <a href="#" class="sidebar-foot-item" id="sidebarSupport" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M9.5 9.5a2.5 2.5 0 0 1 4.2 1.8c0 1.8-2.7 2.2-2.7 3.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="17" r=".75" fill="currentColor"/></svg>
              <span data-i18n="nav.support">Поддержка</span>
            </a>
          </div>
          <div class="sidebar-profile-wrap">
            <button type="button" class="sidebar-profile-trigger" id="profileMenuTrigger" aria-expanded="false" aria-haspopup="menu">
              <img class="sidebar-avatar" id="userAvatar" src="../assets/logo.png" alt="" />
              <div class="sidebar-user-meta">
                <div class="sidebar-user-name" id="userName">—</div>
                <div class="sidebar-user-stats" id="userStats">0.00 $ · —</div>
              </div>
              <span class="sidebar-profile-chevron" aria-hidden="true"></span>
            </button>
            <div class="sidebar-profile-menu" id="profileMenu" hidden role="menu">
              <button type="button" class="sidebar-profile-menu-item" id="profileLogoutBtn" role="menuitem" data-i18n="nav.logout">Выйти</button>
            </div>
          </div>
        </div>
      </aside>

      <div class="shell">
        <header class="topbar">
          <button type="button" class="menu-toggle" id="menuToggle" aria-label="Menu">
            <span class="menu-toggle-bars"></span>
          </button>
        </header>
        <main class="main" id="main"></main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/prefs.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/format.js"></script>
    <script src="js/dropdown.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/sites.js"></script>
    <script src="js/views/settings.js"></script>
    <script src="js/views/team.js"></script>
    <script src="js/views/wallet.js"></script>
    <script src="js/views/support.js"></script>
    <script src="js/shell.js"></script>
  </body>
</html>
