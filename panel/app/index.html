<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0f0c" />
    <title>Garbona — панель воркера</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" href="../assets/logo.png" type="image/png" />
  </head>
  <body>
    <div class="toast-host" id="toastHost"></div>
    <div class="app">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-sheet-handle" aria-hidden="true"></div>
        <div class="sidebar-header">
          <div class="sidebar-logo"><img src="../assets/logo.png" alt="" /></div>
          <div>
            <div class="sidebar-brand">Garbona</div>
            <span class="sidebar-tag">worker</span>
          </div>
          <button type="button" class="sidebar-close" id="sidebarClose" aria-label="Закрыть">✕</button>
        </div>
        <nav class="nav" id="nav">
          <div class="section-label">Основное</div>
          <button type="button" class="nav-item is-active" data-view="logs">
            <svg viewBox="0 0 24 24" fill="none"><path d="M7 3.5h7l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-9.5A1.5 1.5 0 0 1 5.5 20V5A1.5 1.5 0 0 1 7 3.5Z" stroke="currentColor" stroke-width="1.7"/><path d="M14 3.5V8h4.5M8.5 12h7M8.5 15.5h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            Логи
          </button>
          <button type="button" class="nav-item" data-view="trade">
            <svg viewBox="0 0 24 24" fill="none"><path d="M7 8h11l-2.5-2.5M17 16H6l2.5 2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Подмена
          </button>
          <button type="button" class="nav-item" data-view="sites">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.7"/><path d="M4.5 12h15M12 3.75c2.4 2.6 3.6 5.4 3.6 8.25S14.4 17.65 12 20.25C9.6 17.65 8.4 14.85 8.4 12S9.6 6.35 12 3.75Z" stroke="currentColor" stroke-width="1.7"/></svg>
            Сайты
          </button>
          <button type="button" class="nav-item" data-view="tasks">
            <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="4" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            Задачи
          </button>
          <div class="section-label">Команда</div>
          <button type="button" class="nav-item" data-view="team">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8.5" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M3.8 18.5c.7-3 2.7-4.6 5.2-4.6s4.5 1.6 5.2 4.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="16.5" cy="9" r="2.3" stroke="currentColor" stroke-width="1.7"/><path d="M14.8 14.2c1.6.4 2.9 1.6 3.4 3.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            Команда
          </button>
          <div class="section-label">Остальное</div>
          <button type="button" class="nav-item" data-view="settings">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M12 4.5v2M12 17.5v2M4.5 12h2M17.5 12h2M6.7 6.7l1.4 1.4M15.9 15.9l1.4 1.4M17.3 6.7l-1.4 1.4M8.1 15.9l-1.4 1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            Настройки
          </button>
          <button type="button" class="nav-item" data-view="support">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5.5 11a6.5 6.5 0 0 1 13 0v5.5a2 2 0 0 1-2 2H14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M5.5 12.5v3a1.5 1.5 0 0 0 1.5 1.5h.5M18.5 12.5v3a1.5 1.5 0 0 1-1.5 1.5h-.5" stroke="currentColor" stroke-width="1.7"/></svg>
            Поддержка
          </button>
          <button type="button" class="nav-item" data-view="terms">
            <svg viewBox="0 0 24 24" fill="none"><path d="M7 4h7l4 4v12H7V4Z" stroke="currentColor" stroke-width="1.7"/><path d="M14 4v4h4M9 12h6M9 15.5h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            Соглашение
          </button>
        </nav>
        <div class="sidebar-footer">
          <button type="button" class="logout-btn" id="logoutBtn">Выйти</button>
        </div>
      </aside>

      <div class="shell">
        <header class="topnav">
          <button type="button" class="menu-toggle" id="menuToggle" aria-label="Меню">
            <span class="menu-toggle-bars"></span>
          </button>
          <div class="topnav-user">
            <img class="topnav-avatar" id="userAvatar" src="../assets/logo.png" alt="" />
            <div>
              <div class="topnav-name" id="userName">—</div>
              <div class="topnav-role" id="userRole">worker</div>
            </div>
          </div>
          <div class="topnav-spacer"></div>
          <div class="balance-pill" id="userBalance">$0.00</div>
        </header>
        <main class="main" id="main"></main>
      </div>

      <nav class="mobile-nav" id="mobileNav" aria-label="Основное меню">
        <button type="button" class="mobile-nav-item is-active" data-view="logs">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 3.5h7l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-9.5A1.5 1.5 0 0 1 5.5 20V5A1.5 1.5 0 0 1 7 3.5Z" stroke="currentColor" stroke-width="1.7"/></svg>
          <span>Логи</span>
        </button>
        <button type="button" class="mobile-nav-item" data-view="sites">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.25" stroke="currentColor" stroke-width="1.7"/></svg>
          <span>Сайты</span>
        </button>
        <button type="button" class="mobile-nav-item" data-view="tasks">
          <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="4" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.7"/></svg>
          <span>Задачи</span>
        </button>
        <button type="button" class="mobile-nav-item" data-menu="more">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="6.5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="17.5" cy="12" r="1.5" fill="currentColor"/></svg>
          <span>Меню</span>
        </button>
      </nav>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
