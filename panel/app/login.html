<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0f0c" />
    <title>Garbona — вход воркера</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" href="../assets/logo.png" type="image/png" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-shell">
        <div class="brand">
          <div class="brand-logo"><img src="../assets/logo.png" alt="" /></div>
          <div>
            <span class="brand-name">Garbona</span>
            <span class="brand-tagline">панель воркера</span>
          </div>
        </div>
        <div id="loginError" class="login-error" role="alert">
          <span id="loginErrorText">Не удалось войти</span>
        </div>
        <h1 class="login-title">Вход</h1>
        <p class="login-subtitle">Доступ только для участников команды. Войдите через Telegram.</p>
        <button type="button" class="btn-telegram" id="tgAuthBtn" hidden>
          <span>Войти через Telegram</span>
        </button>
      </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      (async function () {
        const errorEl = document.getElementById("loginError");
        const errorText = document.getElementById("loginErrorText");
        const authBtn = document.getElementById("tgAuthBtn");

        try {
          const cfg = await WorkerAuth.getConfig();
          if (cfg.authDisabled) {
            location.replace("index.html");
            return;
          }
        } catch (_) {}

        try {
          await WorkerAuth.me();
          location.replace("index.html");
          return;
        } catch (_) {}

        window.onTelegramAuth = async function (data) {
          if (!data) {
            errorText.textContent = "Авторизация отменена.";
            errorEl.classList.add("is-visible");
            return;
          }
          errorEl.classList.remove("is-visible");
          try {
            await WorkerAuth.loginTelegram(data);
            location.replace("index.html");
          } catch (err) {
            const map = {
              not_team_member: "Вы не в команде. Подайте заявку в боте.",
              bad_hash: "Неверная подпись Telegram Login.",
              expired: "Данные входа устарели. Попробуйте снова.",
            };
            errorText.textContent = map[err.message] || err.message || "Ошибка входа";
            errorEl.classList.add("is-visible");
          }
        };

        let botId = "";
        try {
          const cfg = await WorkerAuth.getConfig();
          botId = String(cfg.botId || "").trim();
        } catch (err) {
          errorText.textContent = "Не удалось загрузить /api/user/config.";
          errorEl.classList.add("is-visible");
          return;
        }

        if (!/^\d+$/.test(botId)) {
          errorText.textContent = "BOT_TOKEN не задан на сервере.";
          errorEl.classList.add("is-visible");
          return;
        }

        authBtn.hidden = false;
        function startTelegramAuth() {
          if (!window.Telegram?.Login?.auth) {
            errorText.textContent = "Скрипт Telegram Login ещё не загрузился.";
            errorEl.classList.add("is-visible");
            return;
          }
          window.Telegram.Login.auth(
            { bot_id: botId, request_access: true },
            (data) => window.onTelegramAuth(data)
          );
        }
        authBtn.addEventListener("click", startTelegramAuth);

        const script = document.createElement("script");
        script.async = true;
        script.src = "https://telegram.org/js/telegram-widget.js?22";
        script.onerror = () => {
          errorText.textContent = "Не удалось загрузить telegram-widget.js.";
          errorEl.classList.add("is-visible");
        };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
