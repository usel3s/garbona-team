<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#111214" />
    <title>Garbona — панель</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/panel.css" />
    <link rel="icon" href="assets/logo.png" type="image/png" />
  </head>
  <body>
    <div class="toast-host" id="toastHost"></div>
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="drawer" id="drawer">
      <div class="drawer-head">
        <h2 class="drawer-title" id="drawerTitle">Участник</h2>
        <button type="button" class="icon-btn" id="drawerClose" aria-label="Закрыть">✕</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>

    <div class="app">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-sheet-handle" aria-hidden="true"></div>
        <div class="sidebar-header">
          <div class="sidebar-logo"><img src="assets/logo.png" alt="" /></div>
          <div>
            <div class="sidebar-brand">Garbona</div>
            <span class="sidebar-tag">panel</span>
          </div>
          <button type="button" class="sidebar-close" id="sidebarClose" aria-label="Закрыть">✕</button>
        </div>
        <nav class="nav" id="nav">
          <div class="section-label">Главное</div>
          <button type="button" class="nav-item is-active" data-view="overview">Обзор</button>
          <button type="button" class="nav-item" data-view="users">Участники</button>
          <button type="button" class="nav-item" data-view="apps">Заявки</button>
          <button type="button" class="nav-item" data-view="payouts">Выплаты</button>

          <div class="section-label nav-section-gap">Работа</div>
          <button type="button" class="nav-item" data-view="comms">Коммуникация</button>
          <button type="button" class="nav-item" data-view="stats">Статистика</button>
          <button type="button" class="nav-item" data-view="economy">Экономика</button>

          <div class="section-label nav-section-gap">Логи</div>
          <button type="button" class="nav-item" data-view="steam">Логи Steam</button>
          <button type="button" class="nav-item" data-view="botlogs">Логи бота</button>
        </nav>
        <div class="sidebar-footer">
          <div class="avatar-wrap">
            <img class="avatar" id="userAvatar" src="assets/logo.png" alt="" />
            <span class="status-dot"></span>
          </div>
          <div class="user-info">
            <div class="user-name" id="userName">—</div>
            <div class="user-role" id="userRole">Админ</div>
          </div>
          <button type="button" class="logout-btn" id="logoutBtn" title="Выйти">⎋</button>
        </div>
      </aside>

      <div class="shell">
        <header class="topnav">
          <button type="button" class="menu-toggle" id="menuToggle" aria-label="Меню">
            <span class="menu-toggle-bars" aria-hidden="true"></span>
          </button>
          <div class="topnav-title" id="pageTitle">Обзор</div>
          <div class="topnav-spacer"></div>
        </header>
        <main class="main" id="main"></main>
      </div>

      <nav class="mobile-nav" id="mobileNav" aria-label="Основное меню">
        <button type="button" class="mobile-nav-item is-active" data-view="overview">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
          <span>Обзор</span>
        </button>
        <button type="button" class="mobile-nav-item" data-view="users">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.7"/>
            <path d="M3.5 19.5c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="17" cy="9" r="2.4" stroke="currentColor" stroke-width="1.7"/>
            <path d="M15.2 14.4c1.7.4 3 1.7 3.5 3.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <span>Люди</span>
        </button>
        <button type="button" class="mobile-nav-item" data-view="apps">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 4h10a2 2 0 0 1 2 2v14l-3.2-2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M9 9h6M9 13h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <span>Заявки</span>
        </button>
        <button type="button" class="mobile-nav-item" data-view="payouts">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.5" y="6" width="17" height="12" rx="2.5" stroke="currentColor" stroke-width="1.7"/>
            <path d="M3.5 10h17" stroke="currentColor" stroke-width="1.7"/>
            <circle cx="15.5" cy="14.5" r="1.4" fill="currentColor"/>
          </svg>
          <span>Выплаты</span>
        </button>
        <button type="button" class="mobile-nav-item" data-menu="more" id="mobileMoreBtn">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="6.5" cy="12" r="1.5" fill="currentColor"/>
            <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
            <circle cx="17.5" cy="12" r="1.5" fill="currentColor"/>
          </svg>
          <span>Ещё</span>
        </button>
      </nav>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/member.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
